name: Read-aloud audio

# Manual backup for read-aloud audio. The regular timer is Supabase's pg_cron
# (migration 20261024000009_audio_cron.sql), which calls the app every minute;
# GitHub's schedule ran hours late. Run this by hand to push through a backlog:
# it keeps calling until every card is done, the free budget is reached, or
# 9 minutes pass.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - name: Make audio in rounds
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$INGEST_SECRET" ]; then
            echo "::error::SITE_URL and INGEST_SECRET repository secrets are required"; exit 1
          fi
          end=$((SECONDS + 540))
          while [ $SECONDS -lt $end ]; do
            code=$(curl -sS -o resp.json -w "%{http_code}" -X POST "${SITE_URL%/}/api/tts/backfill" \
              -H "Authorization: Bearer $INGEST_SECRET" --max-time 75 || echo 000)
            echo "HTTP $code $(cat resp.json 2>/dev/null)"
            [ "$code" = "200" ] || { sleep 20; continue; }
            stopped=$(jq -r .stopped resp.json); remaining=$(jq -r .remaining resp.json)
            # "busy" = another round is running right now; wait and retry.
            if [ "$stopped" = "busy" ]; then sleep 30; continue; fi
            if [ "$stopped" != "time" ] || [ "$remaining" = "0" ]; then break; fi
          done
